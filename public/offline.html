<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12324a" />
    <title>Offline · Jobdenker</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: #12324a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      img { width: 200px; max-width: 70vw; height: auto; }
      h1 { font-size: 1.5rem; margin: 0; }
      p { margin: 0; max-width: 28rem; line-height: 1.6; color: #cbd5e1; }
      button {
        margin-top: 0.5rem;
        border: 0;
        cursor: pointer;
        border-radius: 0.75rem;
        padding: 0.85rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #12324a;
        background: linear-gradient(135deg, #c7e70c, #a3e635);
      }
    </style>
  </head>
  <body>
    <img src="/logo/jobdenker-logo-white.png" alt="Jobdenker" />
    <h1>Du bist offline</h1>
    <p>Es besteht gerade keine Internetverbindung. Sobald du wieder online bist, kannst du Jobdenker normal nutzen.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </body>
</html>
